<!DOCTYPE html>
<html lang="om">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reward Game</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h1>🎮 Reward Game</h1>

    <h2>🪙 Your Coins: <span id="coins">0</span></h2>

    <section>
      <h2>🎁 Daily Reward</h2>
      <button onclick="dailyBonus()">Claim Daily Reward +50</button>
    </section>

    <section>
      <h2>📺 Earn Coins</h2>
      <button onclick="watchAd()">Watch Ad +10</button>
    </section>

    <section class="referral-box">
      <h2>👥 Invite Friends</h2>

      <p>
        Your Referral Code:
        <strong id="referralCode">---</strong>
      </p>

      <button onclick="shareReferral()">
        📤 Share Invite
      </button>

      <p>
        Friends Invited:
        <strong id="referralCount">0</strong>
      </p>
    </section>

    <section>
      <h2>💰 Withdraw</h2>

      <input
        type="number"
        id="withdrawAmount"
        placeholder="Amount of coins"
      >

      <select id="paymentMethod" onchange="paymentMethodChanged()">
        <option value="">Payment method</option>
        <option value="Telebirr">Telebirr</option>
        <option value="Bank">Bank</option>
      </select>

      <input
        type="text"
        id="paymentDetails"
        placeholder="Telebirr number / Bank account"
      >

      <button onclick="withdraw()">Withdraw</button>

      <div id="withdrawalHistory"></div>
    </section>

    <section>
      <h2>👤 Account</h2>

      <p id="welcome">Welcome, Guest!</p>

      <input
        type="email"
        id="email"
        placeholder="Email"
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
      >

      <button onclick="signup()">Sign Up</button>
      <button onclick="login()">Login</button>
      <button onclick="logout()">Logout</button>
    </section>

    <p id="message"></p>

  </div>

  <script type="module" src="script.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("service-worker.js")
          .then(() => console.log("Service Worker registered!"))
          .catch((error) => console.error("Service Worker error:", error));
      });
    }
  </script>

</body>
</html>
